# TINVOICES
TINVOICES_ADD = INSERT INTO TInvoices (id, entityState, createdAt, updatedAt, version, date, number, state, usedForVoucher, subtotal, total, vatAmount, vatRate) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
TINVOICES_FINDALL = SELECT id, entityState, createdAt, updatedAt, version, date, number, state, usedForVoucher, subtotal, total, vatAmount, vatRate FROM TInvoices
TINVOICES_FINDBYID = SELECT id, entityState, createdAt, updatedAt, version, date, number, state, usedForVoucher, subtotal, total, vatAmount, vatRate FROM TInvoices WHERE id = ?
TINVOICES_FINDBYPAYERID = SELECT DISTINCT i.id, i.entityState, i.createdAt, i.updatedAt, i.version, i.date, i.number, i.state, i.usedForVoucher, i.subtotal, i.total, i.vatAmount, i.vatRate \
    FROM TInvoices i \
    JOIN TCharges ch ON ch.invoice_id = i.id \
    JOIN TPaymentMeans p ON ch.paymentMean_id = p.id \
    WHERE p.client_id = ?
TINVOICES_FINDLASTNUMBER = SELECT MAX(number) FROM TInvoices
TINVOICES_REMOVE = DELETE FROM TInvoices WHERE id = ?
TINVOICES_UPDATE = UPDATE TInvoices SET entityState = ?, updatedAt = ?, version = ?, date = ?, number = ?, state = ?, usedForVoucher = ?, subtotal = ?, total = ?, vatAmount = ?, vatRate = ? WHERE id = ?

