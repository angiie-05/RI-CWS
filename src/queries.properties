# TWORKORDERS
TWORKORDERS_ADD = INSERT INTO TWorkOrders (id, entityState, createdAt, updatedAt, version, date, description, state, usedForVoucher, total_amount, invoice_id, mechanic_id, vehicle_id) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
TWORKORDERS_FINDALL = SELECT id, entityState, createdAt, updatedAt, version, date, description, state, usedForVoucher, total_amount, invoice_id, mechanic_id, vehicle_id FROM TWorkOrders
TWORKORDERS_FINDBYCLIENTIDANDINVOICESTATE = SELECT w.id, w.entityState, w.createdAt, w.updatedAt, w.version, w.date, w.description, w.state, w.usedForVoucher, w.total_amount, w.invoice_id, w.mechanic_id, w.vehicle_id \
    FROM TWorkOrders w \
    JOIN TVehicles v ON w.vehicle_id = v.id \
    JOIN TInvoices i ON w.invoice_id = i.id \
    WHERE v.client_id = ? AND i.state = ? \
    ORDER BY w.date
TWORKORDERS_FINDBYCLIENTNIFANDSTATE = SELECT w.id, w.entityState, w.createdAt, w.updatedAt, w.version, w.date, w.description, w.state, w.usedForVoucher, w.total_amount, w.invoice_id, w.mechanic_id, w.vehicle_id \
    FROM TWorkOrders w \
    JOIN TVehicles v ON w.vehicle_id = v.id \
    JOIN TClients c ON v.client_id = c.id \
    WHERE c.nif = ? AND w.state = ?
TWORKORDERS_FINDBYID = SELECT id, entityState, createdAt, updatedAt, version, date, description, state, usedForVoucher, total_amount, invoice_id, mechanic_id, vehicle_id FROM TWorkOrders WHERE id = ?
TWORKORDERS_FINDBYMECHANICID = SELECT id, entityState, createdAt, updatedAt, version, date, description, state, usedForVoucher, total_amount, invoice_id, mechanic_id, vehicle_id FROM TWorkOrders WHERE mechanic_id = ?
TWORKORDERS_REMOVE = DELETE FROM TWorkOrders WHERE id = ?
TWORKORDERS_UPDATE = UPDATE TWorkOrders SET entityState = ?, updatedAt = ?, version = ?, date = ?, description = ?, state = ?, usedForVoucher = ?, total_amount = ?, invoice_id = ?, mechanic_id = ?, vehicle_id = ? WHERE id = ?
