# TCASHES
TCASHES_ADD = INSERT INTO TCashes (id) VALUES (?)
TCASHES_REMOVE = DELETE FROM TCashes WHERE id = ?

# TCLIENTS
TCLIENTS_ADD = INSERT INTO TClients (id, entityState, createdAt, updatedAt, version, nif, name, surname, street, city, country, postalCode, phone, email) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
TCLIENTS_FINDALL = SELECT id, entityState, createdAt, updatedAt, version, nif, name, surname, street, city, country, postalCode, phone, email FROM TClients
TCLIENTS_FINDBYID = SELECT id, entityState, createdAt, updatedAt, version, nif, name, surname, street, city, country, postalCode, phone, email FROM TClients WHERE id = ?
TCLIENTS_FINDBYNIF = SELECT id, entityState, createdAt, updatedAt, version, nif, name, surname, street, city, country, postalCode, phone, email FROM TClients WHERE nif = ?
TCLIENTS_FINDRECOMMENDEDBY = SELECT c.id, c.entityState, c.createdAt, c.updatedAt, c.version, c.nif, c.name, c.surname, c.street, c.city, c.country, c.postalCode, c.phone, c.email \
    FROM TClients c \
    JOIN TRecommendations r ON r.recommended_id = c.id \
    WHERE r.recommender_id = ?
TCLIENTS_REMOVE = DELETE FROM TClients WHERE id = ?
TCLIENTS_UPDATE = UPDATE TClients SET entityState = ?, updatedAt = ?, version = ?, nif = ?, name = ?, surname = ?, street = ?, city = ?, country = ?, postalCode = ?, phone = ?, email = ? WHERE id = ?

# TCREDITCARDS
TCREDITCARDS_REMOVE = DELETE FROM TCreditCards WHERE id = ?

# TINTERVENTIONS
TINTERVENTIONS_FINDBYMECHANICID = SELECT id, entityState, createdAt, updatedAt, version, date, minutes, mechanic_id, workorder_id FROM TInterventions WHERE mechanic_id = ?

# TINVOICES
TINVOICES_ADD = INSERT INTO TInvoices (id, entityState, createdAt, updatedAt, version, date, number, state, usedForVoucher, subtotal, total, vatAmount, vatRate) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
TINVOICES_FINDBYPAYERID = SELECT DISTINCT i.id, i.entityState, i.createdAt, i.updatedAt, i.version, i.date, i.number, i.state, i.usedForVoucher, i.subtotal, i.total, i.vatAmount, i.vatRate \
    FROM TInvoices i \
    JOIN TCharges ch ON ch.invoice_id = i.id \
    JOIN TPaymentMeans p ON ch.paymentMean_id = p.id \
    WHERE p.client_id = ?
TINVOICES_FINDLASTNUMBER = SELECT MAX(number) FROM TInvoices

